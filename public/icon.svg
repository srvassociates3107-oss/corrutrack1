<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171717" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#fbbf24" stroke-opacity="0.22" stroke-width="6" />
  <!-- Isometric Corrugated Box -->
  <g transform="translate(256, 245)">
    <!-- Top Left Flap -->
    <polygon points="0,-130 -135,-62 0,6 135,-62" fill="#fcd34d" />
    <!-- Top Flap Seam -->
    <line x1="-67" y1="-96" x2="67" y2="-28" stroke="#92400e" stroke-width="8" stroke-linecap="round" />
    <!-- Left Face -->
    <polygon points="-135,-62 0,6 0,152 -135,84" fill="url(#amberGrad)" />
    <!-- Right Face -->
    <polygon points="135,-62 0,6 0,152 135,84" fill="#b45309" />
    <!-- Corrugated Flute Wave Accent on Right Face -->
    <path d="M 28,28 Q 48,8 68,28 T 108,28" fill="none" stroke="#fef3c7" stroke-width="8" stroke-linecap="round" opacity="0.7" />
    <path d="M 28,62 Q 48,42 68,62 T 108,62" fill="none" stroke="#fef3c7" stroke-width="8" stroke-linecap="round" opacity="0.7" />
    <!-- Live Sync Pulse Badge -->
    <circle cx="-68" cy="48" r="24" fill="#10b981" stroke="#0a0a0a" stroke-width="6" />
    <polyline points="-78,48 -71,55 -56,40" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
